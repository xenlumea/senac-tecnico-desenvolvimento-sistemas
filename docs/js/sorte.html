<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./sorte.js" defer></script>
    <title>Sorte</title>
</head>

<body>
    <div class="container rounded-2" style="margin-top: 100px; background-color: lightblue; padding: 20px">
        <div class="container d-flex flex-column justify-content-center align-items-center"
            style="text-align: center; width: 500px">
            <h1>Sorte</h1>
            <h2 class="text-nowrap">Escolha a imagem da sorte</h2>

            <select id="escolha" class="form-select text-center px-0">
                <option selected value="">Selecione uma opção</option>
                <option value="1">Animal</option>
                <option value="2">Homem</option>
                <option value="3">Mulher</option>
                <option value="4">Criança</option>
                <option value="5">Idosa</option>
            </select>

            <button type="button" class="btn btn-success w-100" style="margin-top: 10px" id="exibir">Exibir</button>

            <div id="resultado" class="rounded-2 w-100"
                style="background-color: white; text-align: center; margin-top: 10px">
                <h2>Imagem do computador</h2>
                <div id="container-imagem">
                    <img id="imagem" src="" />
                </div>
            </div>

            <div id="mensagem" class="rounded-2 w-100"
                style="background-color: white; text-align: center; margin-top: 10px"></div>
        </div>
    </div>

    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-success">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
