<!doctype html>
<html lang="p-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <script src="./a15.js" defer></script>
    <title>Temperatura da água</title>
</head>

<body>
    <div class="container rounded-2" style="margin-top: 100px; background-color: lightblue; padding: 20px">
        <div class="container d-flex flex-column justify-content-center align-items-center" style="text-align: center">
            <h1>Formação da água</h1>
            <h2>
                <label for="temperatura"> Digite a temperatura </label>
            </h2>

            <input type="text" id="temperatura" class="form-control" style="width: 200px" />

            <button type="button" class="btn btn-success" style="width: 200px; margin-top: 10px" id="exibe">
                Exibir
            </button>

            <h2 id="resultado" class="rounded-2"
                style="background-color: white; width: 300px; text-align: center; margin-top: 10px">
                Estado da Água
            </h2>

            <div id="imagem"></div>
        </div>
    </div>
    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-success">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
