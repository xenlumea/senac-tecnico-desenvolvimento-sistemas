<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <script src="./a28.js" defer></script>
    <title>Intervalos</title>
</head>

<body>
    <!--
        28) Faça um algoritmo que leia três números em ordem crescente (por exemplo: 3, 50 e 150). Exiba os números crescentes do primeiro até o valor do meio; depois exiba, em ordem decrescente, os números do terceiro até o valor do meio.

        -->

    <div class="container rounded-2" style="margin-top: 100px; background-color: lightblue; padding: 20px">
        <div class="container d-flex flex-column justify-content-center align-items-center" style="text-align: center">
            <h1>Intervalos entre 3 números.</h1>

            <label for="numero1"> Digite o número 1 </label>
            <input type="text" id="numero1" class="form-control" style="width: 200px" />

            <label for="numero2"> Digite o número 2 </label>
            <input type="text" id="numero2" class="form-control" style="width: 200px" />

            <label for="numero3"> Digite o número 3 </label>
            <input type="text" id="numero3" class="form-control" style="width: 200px" />

            <button type="button" class="btn btn-success" style="width: 200px; margin-top: 10px" id="exibe">
                Exibir
            </button>

            <h2 id="resultado1" class="rounded-2"
                style="background-color: white; width: 300px; text-align: justify; margin-top: 10px"></h2>

            <h2 id="resultado2" class="rounded-2"
                style="background-color: white; width: 300px; text-align: justify; margin-top: 10px"></h2>
        </div>
    </div>
    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-success">Voltar</button>
            </a>
        </div>
    </footer>
</body>
