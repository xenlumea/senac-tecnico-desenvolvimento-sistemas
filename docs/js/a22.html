<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="./a22.js" defer></script>
    <title>Nome 10 vezes</title>

<body>
    <!--
        22)  Faça um algoritmo que leia um nome qualquer e exiba-o 10 vezes.
        -->

    <div class="container rounded-2" style="margin-top: 100px; background-color: lightblue; padding: 20px">
        <div class="container d-flex flex-column justify-content-center align-items-center" style="text-align: center">
            <h1>Exibe nome 10 vezes.</h1>
            <h2>
                <label for="nome"> Digite o nome </label>
            </h2>

            <input type="text" id="nome" class="form-control" style="width: 200px" />

            <button type="button" class="btn btn-success" style="width: 200px; margin-top: 10px" id="exibe">
                Exibir
            </button>

            <h2 id="resultado" class="rounded-2"
                style="background-color: white; width: 300px; text-align: center; margin-top: 10px"></h2>
        </div>
    </div>
    <footer>
        <div class="container my-3">
            <a href="./js.html">

            </a>
        </div>
