<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./imc.js" defer></script>
    <title>Calculadora de IMC</title>
</head>

<body>
    <div class="container rounded-2" style="margin-top: 100px; background-color: lightblue; padding: 20px">
        <div class="container d-flex flex-column justify-content-center align-items-center">
            <h1>Calculadora de IMC</h1>

            <label for="peso">Peso(kg)</label>
            <input class="form-control" id="peso" type="text" style="width: 200px" />

            <label for="altura">Altura(m)</label>
            <input class="form-control" id="altura" type="text" style="width: 200px" />

            <button id="calcular" type="button" class="btn btn-success" style="width: 200px; margin-top: 10px">
                CALCULAR IMC
            </button>

            <div class="jumbotron" style="margin-top: 10px">
                <h2 id="resultado" class="rounded-2" style="background-color: white; width: 200px; text-align: center">
                    IMC =
                </h2>
            </div>
            <div class="jumbotron" style="margin-top: 10px; text-align: center">
                Condição
                <h2 id="condicao" class="rounded-2" style="background-color: white; width: 300px; text-align: center">
                    Condição
                </h2>
            </div>
            <div id="div-imagem" style="max-width: 600px"></div>
        </div>
    </div>

    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-success">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
