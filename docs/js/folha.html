<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./folha.js" defer></script>
    <title>Folha de Pagamento</title>
</head>

<body class="min-vh-100 d-flex flex-column d-flex justify-content-center align-items-center" style="
            background-image: url(./assets/img/folha/fundo-dinheiro.jpg);
            background-size: cover;
            backdrop-filter: blur(4px);
        ">
    <div class="container bg-dark py-3">
        <h1 class="text-center text-light bg-secondary rounded-3">Folha de Pagamento</h1>

        <div id="entrada-dados" class="bg-secondary container mt-4 py-4">
            <!-- INICIO - ENTRADA DE DADOS -->

            <div class="container">
                <div class="row mb-2">
                    <div class="col">
                        <label style="min-width: 60px" class="text-light" for="nome">Nome: </label>
                        <input id="nome" type="text" placeholder="Digite o nome" />
                    </div>

                    <div class="col d-flex align-items-center gap-2">
                        <div style="min-width: 60px" class="text-light">Sexo:</div>

                        <div class="d-flex flex-nowrap align-items-center gap-2">
                            <span class="d-flex flex-nowrap">
                                <input type="radio" id="sexo-f" value="f" name="sexo" />
                                <label class="text-light" for="sexo-f">Feminino</label>
                            </span>
                            <span class="d-flex flex-nowrap">
                                <input type="radio" id="sexo-m" value="m" name="sexo" />
                                <label class="text-light" for="sexo-m">Masculino</label>
                            </span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <div>
                                <label style="min-width: 60px" class="text-light" for="opcao-pensao">Pensão:
                                </label>
                                <select name="pensao" id="opcao-pensao">
                                    <option value="sim">Sim</option>
                                    <option value="nao">Não</option>
                                </select>
                            </div>

                            <div>
                                <label style="min-width: 60px" class="text-light" for="salario-bruto">Salário: </label>
                                <input id="salario-bruto" type="text" placeholder="Digite o salário" />
                            </div>
                        </div>

                        <div class="col text-end">
                            <div>
                                <label class="text-light" for="horas-extras">Horas-Extras</label>
                                <input id="horas-extras" type="number" placeholder="Horas" />
                            </div>

                            <div>
                                <label class="text-light" for="numero-faltas">Numero de Faltas</label>
                                <input id="numero-faltas" type="number" placeholder="Faltas" />
                            </div>

                            <div>
                                <label class="text-light" for="numero-dependentes">Número de dependentes</label>
                                <input id="numero-dependentes" type="number" placeholder="Dependentes" />
                            </div>
                        </div>

                        <div class="col d-flex flex-column align-items-center justify-content-center gap-2 mx-auto py-2"
                            style="max-width: fit-content">
                            <button type="button" id="calcular" class="btn btn-info" style="width: 150px">
                                Calcular
                            </button>
                            <button id="fechar" type="button" class="btn btn-warning" style="width: 150px">
                                Fechar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- FIM - ENTRADA DE DADOS -->

            <div class="bg-secondary-subtle container mt-4">
                <h2 class="text-center fs-2 fw-bold mb-0">Demonstrativo de Pagamento</h2>
                <p id="identificacao" class="text-center fs-3">Bem vindo!</h2>

                <div class="container row justify-content-center gap-3 mx-auto">
                    <!-- AGRUPA PROVENTOS E DESCONTOS-->

                    <div class="col">
                        <!-- INICIO - PROVENTOS -->

                        <div style="background-color: lightblue" class="container d-flex flex-column gap-2 mb-3 py-2">
                            <h3 class="text-center">Proventos</h3>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-salario-bruto"
                                    class="flex-grow-1 text-center my-auto py-0">Salário Bruto</label>
                                <input id="resultado-salario-bruto" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-salario-familia"
                                    class="flex-grow-1 text-center my-auto py-0">Salário Familia</label>
                                <input id="resultado-salario-familia" class="text-black text-end"
                                    style="max-width: 300px" readonly disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-horas-extras" class="flex-grow-1 text-center my-auto py-0">Horas
                                    Extras </label>
                                <input id="resultado-horas-extras" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-proventos" class="flex-grow-1 text-center my-auto py-0"> Total
                                    Proventos </label>
                                <input id="resultado-proventos" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                        </div>
                    </div>
                    <!-- FIM - PROVENTOS -->

                    <div class="col">
                        <div style="background-color: lightcoral" class="container d-flex flex-column gap-2 mb-3 py-2">
                            <!-- INICIO - Descontos -->
                            <h3 class="text-center">Descontos</h3>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-faltas" class="flex-grow-1 text-center my-auto py-0">Valor
                                    Falta</label>
                                <input id="resultado-faltas" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-pensao-alimenticia"
                                    class="flex-grow-1 text-center my-auto py-0">Pensão Alimentícia</label>
                                <input id="resultado-pensao-alimenticia" class="text-black text-end"
                                    style="max-width: 300px" readonly disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-inss" class="flex-grow-1 text-center my-auto py-0">Valor do INSS
                                </label>
                                <input id="resultado-inss" class="text-black text-end" style="max-width: 300px" readonly
                                    disabled value="0.00" />
                            </div>
                            <div class="border border-black d-flex flex-nowrap">
                                <label for="resultado-descontos" class="flex-grow-1 text-center my-auto py-0">Total
                                    Descontos</label>
                                <input id="resultado-descontos" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                        </div>
                        <!-- FIM - Descontos -->

                        <div class="bg-success container row mx-0 mb-3 py-3 justify-content-end">
                            <!-- SALÁRIO LIQUIDO-->

                            <div class="bg-success-subtle border border-black d-flex flex-nowrap mx-0 px-0">
                                <label for="salario-liquido" class="flex-grow-1 text-center my-auto py-0">Salário
                                    Líquido</label>
                                <input id="salario-liquido" class="text-black text-end" style="max-width: 300px"
                                    readonly disabled value="0.00" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-danger">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
