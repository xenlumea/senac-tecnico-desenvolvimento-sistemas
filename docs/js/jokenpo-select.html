<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./jokenpo-select.js" defer></script>
    <title>JoKenPo</title>
</head>

<body class="container min-vh-100 d-flex flex-column justify-content-center align-items-center"
    style="background-color: #936645">
    <div class="container rounded-2 py-2" style="background-color: #7a4e47">
        <h1 class="shadow p-3 my-2 rounded text-center" style="background-color: #dba367">
            Pedra, Papel e Tesoura (JoKenPô)
        </h1>

        <div class="row">
            <div class="container row mx-0 gap-3">
                <div class="col text-center rounded-2" style="background-color: #dba367">
                    <p class="fs-1 my-0 py-0">Você</p>
                    <div class="mx-auto" style="max-width: 300px">
                        <img id="imagem-jogador" src="./assets/img/jokenpo/jokenpo.jpg" class="my-3"
                            style="max-width: 100%; height: auto" />
                    </div>

                    <select id="opcao-jogador" class="form-select mb-3 text-center"
                        style="background-color: #dbcec3; cursor: pointer">
                        <option selected value="">Escolha uma opção</option>
                        <option value="1">Pedra</option>
                        <option value="2">Papel</option>
                        <option value="3">Tesoura</option>
                    </select>
                </div>

                <div class="col text-center rounded-2" style="background-color: #dba367">
                    <p class="fs-1 my-0 py-0">Computador</p>
                    <div class="mx-auto" style="max-width: 300px">
                        <img id="imagem-computador" src="./assets/img/jokenpo/jokenpo.jpg" class="my-3"
                            style="max-width: 100%; height: auto" />
                    </div>
                    <select id="opcao-computador" class="form-select mb-3 text-center px-0"
                        style="background-image: none; background-color: #dbcec3" disabled>
                        <option selected value=""></option>
                        <option value="1">Pedra</option>
                        <option value="2">Papel</option>
                        <option value="3">Tesoura</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="d-grid gap-2 my-2">
            <button id="btn-jogar" class="btn btn-success" type="button">Jogar!</button>
        </div>

        <p class="shadow p-3 my-2 rounded" style="background-color: #dba367">
            Você escolheu: <span id="msg-escolha-jogador"></span>
        </p>
        <p class="shadow p-3 my-2 rounded" style="background-color: #dba367">
            O computador escolheu: <span id="msg-escolha-computador"></span>
        </p>
        <p class="shadow p-3 my-2 rounded" style="background-color: #dba367">
            Resultado: <span id="resultado"></span>
        </p>
    </div>

    <footer style="align-self: flex-start">
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-success">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
