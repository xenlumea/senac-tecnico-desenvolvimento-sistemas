<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./juros.js" defer></script>
    <title>Juros</title>
</head>

<body class="min-vh-100 d-flex flex-column"
    style="background-image: url(./assets/img/moedas.jpg); background-size: cover; backdrop-filter: blur(5px)">
    <div class="container bg-dark py-3 mt-3 d-flex flex-column rounded-3" style="max-width: 700px">
        <h1 class="text-center text-light bg-secondary rounded-3 mb-5">Cálculo de Juros</h1>

        <div class="d-flex flex-wrap">
            <div class="flex-grow-1">
                <div class="input-group mb-3" style="min-width: 400px">
                    <span class="input-group-text flex-grow-1">Valor do empréstimo</span>
                    <span class="input-group-text">R$</span>
                    <input type="text" class="form-control" id="valor-emprestimo" value="0.00" style="max-width: 25%" />
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text flex-grow-1">Número de prestações</span>
                    <input type="number" class="form-control" id="numero-prestacoes" value="0" min="0" step="1"
                        style="max-width: 25%" />
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text flex-grow-1">Percentual de juros mensais</span>
                    <span class="input-group-text">%</span>
                    <input id="percentual-juros" type="text" class="form-control" value="0.00" style="max-width: 25%" />
                </div>
            </div>

            <div class="col d-flex flex-column gap-3 justify-content-center align-items-center mx-2 py-3"
                style="min-width: 100px">
                <button type="button" id="calcular" class="btn btn-success w-100">Calcular</button>
                <button type="button" id="fechar" class="btn btn-warning w-100">Fechar</button>
            </div>
        </div>

        <div class="d-flex flex-row flex-wrap justify-content-evenly bg-secondary rounded-3 p-2 gap-2">
            <div class="flex-grow-1">
                <div class="input-group my-2">
                    <span class="input-group-text justify-content-center bg-success text-light"
                        style="min-width: 200px">Montante Simples:
                    </span>
                    <input id="montante-simples" disabled type="text" class="form-control"
                        style="background-color: lightgreen" value="-" />
                </div>

                <div class="input-group my-2">
                    <span class="input-group-text justify-content-center bg-success text-light"
                        style="min-width: 200px">Prestação Simples:
                    </span>
                    <input id="prestacao-simples" disabled type="text" class="form-control"
                        style="background-color: lightgreen" value="-" />
                </div>
            </div>

            <div class="flex-grow-1">
                <div class="input-group my-2">
                    <span class="input-group-text justify-content-center bg-info" style="min-width: 200px">Montante
                        Composto:</span>
                    <input id="montante-composto" disabled type="text" class="form-control" value="-"
                        style="background-color: lightblue" />
                </div>

                <div class="input-group my-2">
                    <span class="input-group-text justify-content-center bg-info" style="min-width: 200px">Prestação
                        Composto:</span>
                    <input id="prestacao-composto" disabled type="text" class="form-control" value="-"
                        style="background-color: lightblue" />
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container my-3">
            <a href="./js.html">
                <button type="button" class="btn btn-danger">Voltar</button>
            </a>
        </div>
    </footer>
</body>

</html>
