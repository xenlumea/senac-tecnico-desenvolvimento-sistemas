<!doctype html>
<html lang="pt-br">
<!--
    style="background-color: lightcoral
    style="background-color: antiquewhite;
-->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="./index.js" defer></script>

    <title>Prova 2 - Doceria da Vovó Maria</title>
</head>

<body class="container min-vh-100 d-flex flex-column pt-3" style="background-color: #fcc0c5">
    <main class="container flex-grow-1 d-flex flex-row align-items-center justify-content-center rounded-4">
        <div style="background-color: #ad7958; max-width: 800px"
            class="p-4 d-flex flex-column gap-4 flex-grow-1 rounded-4">
            <div style="max-width: 300px" class="mx-auto">
                <img src="./assets/img/logo/logo-ia-600px.jpg" class="img-fluid rounded-circle"
                    alt="Logo doceria da vovó maria" />
            </div>

            <div id="aviso" style="background-color: rgb(201, 45, 45); display: none"
                class="m-0 p-2 rounded-2 text-white text-center">
                USUÁRIO INVÁLIDO OU SENHA INCORRETA!
            </div>

            <div style="background-color: antiquewhite" class="p-3 rounded-2">
                <label for="email" class="form-label">Email: </label>
                <input autofocus type="email" class="form-control" id="email"
                    placeholder="Digite seu email: email@exemplo.com" />
            </div>

            <div style="background-color: antiquewhite" class="p-3 rounded-2">
                <label for="senha" class="form-label">Senha: </label>
                <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" />
            </div>

            <div class="text-center">
                <button class="btn m-1" style="width: 50%; background-color: rgb(40, 173, 22)" id="entrar">
                    Entrar
                </button>

                <a href="../provas.html" class="btn bg-warning m-1" style="width: 50%">Voltar</a>
            </div>
        </div>
    </main>
</body>

</html>
