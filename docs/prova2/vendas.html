<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/vendas.css" />
    <link rel="shortcut icon" href="./assets/img/favicon/favicon-cake.png" type="image/png" />
    <script src="./vendas.js" defer></script>
    <title>Vendas</title>
</head>

<body class="container min-vh-100 d-flex flex-column"
    style="background-color: #362417; max-width: 800px; min-width: 0px">
    <header class="d-flex justify-content-evenly align-items-center my-3 py-3 gap-3 rounded-4 container"
        style="background-color: antiquewhite; border: solid 5px #ad7958">
        <div class="d-inline rounded-circle p-1 mx-auto"
            style="min-width: 0px; max-width: 120px; background-color: #ad7958">
            <img src="./assets/img/logo/logo-ia-600px.jpg" class="img-fluid rounded-circle"
                alt="Logo doceria da vovó maria" />
        </div>

        <div class="flex-grow-1 text-center text-white rounded rounded-5 p-2" style="background-color: #ad7958">
            <h1 class="text-center">LANÇAMENTO DE VENDAS</h1>
        </div>
    </header>

    <main class="container rounded-4" style="background-color: antiquewhite; border: solid 5px #ad7958">
        <div class="my-3 p-2 rounded-3" style="background-color: #ad7958">
            <section id="radios" class="border rounded-3 my-3" style="overflow: hidden">
                <p class="text-center my-0 border-bottom border-dark" style="background-color: antiquewhite">
                    Produtos
                </p>

                <div class="d-flex justify-content-around flex-wrap p-2" style="background-color: antiquewhite">
                    <div class="form-check d-flex justify-content-center">
                        <input class="form-check-input" type="radio" name="produto" id="bolo" value="bolo" checked />
                        <label class="form-check-label" for="bolo"> Bolo </label>
                    </div>

                    <div class="form-check d-flex justify-content-center">
                        <input class="form-check-input" type="radio" name="produto" id="pudim" value="pudim" />
                        <label class="form-check-label" for="pudim"> Pudim</label>
                    </div>

                    <div class="form-check d-flex justify-content-center">
                        <input class="form-check-input" type="radio" name="produto" id="quitanda" value="quitanda" />
                        <label class="form-check-label" for="quitanda"> Quitanda </label>
                    </div>

                    <div class="form-check d-flex justify-content-center">
                        <input class="form-check-input" type="radio" name="produto" id="torta" value="torta" />
                        <label class="form-check-label" for="torta"> Torta </label>
                    </div>
                </div>
            </section>

            <div class="input-group mb-3">
                <span style="background-color: antiquewhite" class="input-group-text">Preço do produto</span>
                <input id="preco-produto" type="text" class="form-control" value="0.00" />
            </div>

            <div class="input-group mb-3">
                <span style="background-color: antiquewhite" class="input-group-text">Quantidade</span>
                <input id="quantidade-produto" type="number" step="1" class="form-control" value="0" />
            </div>

            <div class="input-group mb-3">
                <span style="background-color: antiquewhite" class="input-group-text">Desconto em %</span>
                <input id="porcentagem-desconto" type="text" class="form-control" value="0.0" />
            </div>

            <div class="text-center mb-2 d-flex justify-content-around">
                <button type="button" id="calcular" class="btn btn-success" style="width: 250px">Calcular</button>
            </div>
        </div>

        <div class="my-3 rounded-3" style="background-color: #ad7958">
            <section id="resultados" class="d-flex flex-wrap align-items-center justify-content-evenly">
                <div class="mx-3 my-2 p-2 flex-grow-1">
                    <div class="text-center rounded rounded-5 my-3" style="background-color: antiquewhite">
                        <h2 class="fs-4 py-1">RESULTADOS</h2>
                    </div>

                    <div class="input-group mb-3">
                        <span style="background-color: antiquewhite" class="input-group-text">Valor bruto</span>
                        <input id="valor-bruto" disabled type="text" class="form-control" value="0.00" />
                    </div>
                    <div class="input-group mb-3">
                        <span style="background-color: antiquewhite" class="input-group-text">Valor desconto</span>

                        <input id="valor-desconto" disabled type="text" class="form-control" value="0.0" />
                    </div>
                    <div class="input-group mb-3">
                        <span style="background-color: antiquewhite" class="input-group-text">Valor líquido</span>
                        <input id="valor-liquido" disabled type="text" class="form-control" value="0.00" />
                    </div>
                </div>

                <div class="text-center mx-3 my-2 p-2 rounded rounded-circle align-items-center"
                    style="min-width: 0px; max-width: 300px; height: 100%; background-color: antiquewhite">
                    <img id="imagem-produto" src="./assets/img/logo/logo-ia-600px.jpg" class="img-fluid rounded-circle"
                        alt="imagem do produto" style="border: solid 5px #ad7958" />
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container my-3 text-center">
            <a href="./menu.html" class="btn btn-danger" style="width: 250px">Voltar </a>
        </div>
    </footer>
</body>

</html>
